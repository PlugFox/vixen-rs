<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5B8DEE" />
    <title>Vixen — Dashboard</title>
    <meta
      name="description"
      content="Moderator dashboard for the vixen-rs Telegram anti-spam bot."
    />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      // Prevent FOUC: read theme + locale from localStorage before first paint.
      // In Telegram WebApp mode the runtime later overrides via
      // `Telegram.WebApp.colorScheme` (subscribe in webapp-layout).
      (function () {
        var t = localStorage.getItem("vixen_theme") || "system";
        var d =
          t === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t;
        document.documentElement.setAttribute("data-kb-theme", d);
        if (d === "dark") document.documentElement.classList.add("dark");
        var l = localStorage.getItem("vixen_locale");
        if (l === "ru" || l === "en") document.documentElement.lang = l;
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this dashboard.</noscript>
    <div id="root"></div>
    <!-- Telegram WebApp runtime — present when opened from a bot button.
         Safe to load unconditionally: it self-no-ops in regular browsers. -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
